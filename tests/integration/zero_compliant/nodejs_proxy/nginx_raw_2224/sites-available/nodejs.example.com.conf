server {
    listen                  80;
    listen                  8085;
    listen                  [::]:80;
    listen                  [::]:8085;
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             www.nodejs.example.com;
    root                    /var/www/nodejs.example.com/public;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # reverse proxy
    location / {
        proxy_pass            http://127.0.0.1:3000;
        proxy_set_header Host $host;
        include               nginxconfig.io/proxy.conf;
    }

    # additional config
    include nginxconfig.io/general.conf;
}

# non-www, subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             .nodejs.example.com;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;
    return                  301 https://www.nodejs.example.com$request_uri;
}

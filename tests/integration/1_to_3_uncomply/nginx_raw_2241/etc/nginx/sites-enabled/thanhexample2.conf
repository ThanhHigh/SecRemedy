server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    set $base /var/www/html/thanhexample2;
    root $base/public;
    ssl_certificate /etc/letsencrypt/live/thanhexample2/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thanhexample2/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thanhexample2/chain.pem;
    include nginxconfig.io/security.conf;
    # access_log /var/log/nginx/access.log cloudflare buffer=512k flush=1m;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    index index.php;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
        add_header X-Content-Type-Options '"nosniff"' always;
    }
    include nginxconfig.io/general.conf;
    include nginxconfig.io/thanhexample2.wordpress.conf;
    location ~ '\.php$' {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        include nginxconfig.io/php_fastcgi.conf;
        add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
        add_header X-Content-Type-Options '"nosniff"' always;
        # fastcgi_param X-Real-IP $remote_addr;
        # fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        fastcgi_hide_header X-Powered-By;
    }
    add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
    add_header X-Content-Type-Options '"nosniff"' always;
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
    location ^~ /.well-known/acme-challenge/ {
    }
    location ~ /\. {
        deny all;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.thanhexample2;
    ssl_certificate /etc/letsencrypt/live/thanhexample2/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thanhexample2/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thanhexample2/chain.pem;
    return 301 https://thanhexample2$request_uri;
    add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
    add_header X-Content-Type-Options '"nosniff"' always;
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
}
server {
    listen 80;
    listen [::]:80;
    server_name _;
    include nginxconfig.io/letsencrypt.conf;
    location / {
        return 301 https://thanhexample2$request_uri;
        add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
        add_header X-Content-Type-Options '"nosniff"' always;
    }
    add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
    add_header X-Content-Type-Options '"nosniff"' always;
    return 301 https://$host$request_uri;
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
    location ^~ /.well-known/acme-challenge/ {
    }
    location ~ /\. {
        deny all;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thanhexample1.com;
    set $base /var/www/thanhexample1.com;
    root $base/public;
    ssl_certificate /etc/letsencrypt/live/thanhexample1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thanhexample1.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thanhexample1.com/chain.pem;
    include nginxconfig.io/security.conf;
    access_log /var/log/nginx/access.log cloudflare buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ ^/api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    include nginxconfig.io/general.conf;
    location ~ '\.php$' {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        include nginxconfig.io/php_fastcgi.conf;
        fastcgi_param X-Real-IP $remote_addr;
        fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        # fastcgi_hide_header X-Powered-By;
    }
    location ^~ /.well-known/acme-challenge/ {
    }
    # location ~ /\. {
    #     deny all;
    # }
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.thanhexample1.com;
    ssl_certificate /etc/letsencrypt/live/thanhexample1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thanhexample1.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thanhexample1.com/chain.pem;
    # return 301 https://thanhexample1.com$request_uri;
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
}
server {
    listen 80;
    listen [::]:80;
    server_name .thanhexample1.com;
    include nginxconfig.io/letsencrypt.conf;
    location / {
        return 301 https://thanhexample1.com$request_uri;
        add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
        # add_header X-Content-Type-Options '"nosniff"' always;
    }
    # return 301 https://$host$request_uri;
    location ^~ /.well-known/acme-challenge/ {
    }
    # location ~ /\. {
    #     deny all;
    # }
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
}
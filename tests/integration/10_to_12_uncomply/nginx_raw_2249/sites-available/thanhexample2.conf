server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             thanhexample2;
    set                     $base /var/www/html/thanhexample2;
    root                    $base/public;

    # SSL
    ssl_certificate         /etc/letsencrypt/live/thanhexample2/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/thanhexample2/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thanhexample2/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # logging
    access_log              /var/log/nginx/access.log cloudflare buffer=512k flush=1m;
    error_log               /var/log/nginx/error.log warn;

    # index.php
    index                   index.php;

    # index.php fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # additional config
    include nginxconfig.io/general.conf;
    include nginxconfig.io/thanhexample2.wordpress.conf;

    # handle .php
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        include      nginxconfig.io/php_fastcgi.conf;
    }
}

# subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             *.thanhexample2;

    # SSL
    ssl_certificate         /etc/letsencrypt/live/thanhexample2/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/thanhexample2/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thanhexample2/chain.pem;
    return                  301 https://thanhexample2$request_uri;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name .thanhexample2;
    include     nginxconfig.io/letsencrypt.conf;

    location / {
        return 301 https://thanhexample2$request_uri;
    }
}
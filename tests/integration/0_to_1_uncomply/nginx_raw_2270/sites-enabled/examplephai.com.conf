server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name examplephai.com;
    root /var/www/html/public;
    ssl_certificate /etc/letsencrypt/live/examplephai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examplephai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/examplephai.com/chain.pem;
    include nginxconfig.io/security.conf;
    access_log /var/log/nginx/access.log cloudflare buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;
    index index.php;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        include nginxconfig.io/proxy.conf;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
    include nginxconfig.io/general.conf;
    location ^~ /.well-known/acme-challenge/ {
    }
    location ~ /\. {
        deny all;
    }
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.examplephai.com;
    ssl_certificate /etc/letsencrypt/live/examplephai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examplephai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/examplephai.com/chain.pem;
    return 301 https://examplephai.com$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name .examplephai.com;
    include nginxconfig.io/letsencrypt.conf;
    location / {
        return 301 https://examplephai.com$request_uri;
        add_header Content-Security-Policy '"default-src \'self\'; frame-ancestors \'self\'; form-action \'self\';"' always;
        add_header X-Content-Type-Options '"nosniff"' always;
    }
    return 301 https://$host$request_uri;
    location ^~ /.well-known/acme-challenge/ {
    }
    location ~ /\. {
        deny all;
    }
    error_page 500 502 503 504 /custom_50x.html;
    error_page 404 /custom_404.html;
}

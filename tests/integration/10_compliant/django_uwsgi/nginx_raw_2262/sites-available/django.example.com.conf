server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             www.django.example.com;
    set                     $base /var/www/django.example.com;
    root                    $base/public;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # index.php
    index                   index.php;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # index.php fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        include nginxconfig.io/python_uwsgi.conf;
    }

    # Django media
    location /media/ {
        alias $base/media/;
    }

    # Django static
    location /static/ {
        alias $base/static/;
    }

    # additional config
    include nginxconfig.io/general.conf;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# non-www, subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             .django.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    return                  301 https://www.django.example.com$request_uri;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# HTTP redirect
server {
    # 2.5.1 no custom port - comment 8081
    listen      80;
    # listen      8081;
    listen      [::]:80;
    # listen      [::]:8081;
    server_name .django.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # location / {
    #     return 301 https://www.django.example.com$request_uri;
    # }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

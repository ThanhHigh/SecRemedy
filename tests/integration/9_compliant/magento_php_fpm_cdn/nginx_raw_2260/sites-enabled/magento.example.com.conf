upstream php_magento_example_com {
    server unix:/var/run/php/php-fpm.sock;
    server 127.0.0.1:9000 backup;
}

server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             www.magento.example.com;
    set                     $base /var/www/magento.example.com;
    root                    $base/public;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/magento.example.com/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # index.php
    index                   index.php;

    # index.php fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
    }

    # additional config
    include nginxconfig.io/general.conf;
    include nginxconfig.io/magento.conf;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # handle .php
    location ~ [^/]\.php(/|$) {
        fastcgi_pass php_magento_example_com;
        include      nginxconfig.io/php_fastcgi.conf;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;   
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# CDN
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             cdn.magento.example.com;
    root                    /var/www/magento.example.com/public;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/magento.example.com/chain.pem;

    # disable access_log
    # access_log              off;

    # gzip
    gzip                    on;
    gzip_vary               on;
    gzip_proxied            any;
    gzip_comp_level         6;
    gzip_types              text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # allow safe files
    location ~* \.(?:css(\.map)?|js(\.map)?|ttf|ttc|otf|eot|woff2?|svgz?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|pdf|docx?|dotx?|docm|dotm|xlsx?|xltx?|xlsm|xltm|pptx?|potx?|pptm|potm|ppsx?)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
        add_header Cache-Control "public";
        expires    30d;
    }

    # deny everything else
    location / {
        deny all;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# non-www, subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             .magento.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/magento.example.com/chain.pem;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # return                  301 https://www.magento.example.com$request_uri;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# HTTP redirect
server {
    listen      80;
    listen      8085;
    listen      [::]:80;
    listen      [::]:8085;
    server_name cdn.magento.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        return 301 https://cdn.magento.example.com$request_uri;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

server {
    listen      80;
    listen      8085;
    listen      [::]:80;
    listen      [::]:8085;
    server_name .magento.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        return 301 https://www.magento.example.com$request_uri;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

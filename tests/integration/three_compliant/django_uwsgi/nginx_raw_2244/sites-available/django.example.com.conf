server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             www.django.example.com;
    set                     $base /var/www/django.example.com;
    root                    $base/public;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # index.php
    index                   index.php;

    # index.php fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        include nginxconfig.io/python_uwsgi.conf;
    }

    # Django media
    location /media/ {
        alias $base/media/;
    }

    # Django static
    location /static/ {
        alias $base/static/;
    }

    # additional config
    include nginxconfig.io/general.conf;
}

# non-www, subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             .django.example.com;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;
    # return                  301 https://www.django.example.com$request_uri;
}

# HTTP redirect
server {
    # 2.5.1 no custom port - comment 8081
    listen      80;
    # listen      8081;
    listen      [::]:80;
    # listen      [::]:8081;
    server_name .django.example.com;

    location / {
        # return 301 https://www.django.example.com$request_uri;
    }
}

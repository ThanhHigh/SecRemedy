upstream php_spa_example_com {
    server unix:/var/run/php/php-fpm.sock;
    server 127.0.0.1:9000 backup;
}

server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             www.spa.example.com;
    set                     $base /var/www/spa.example.com;
    root                    $base/public;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/spa.example.com/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.php fallback
    location ~ ^/api/v1/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # additional config
    include nginxconfig.io/general.conf;

    # handle .php
    location ~ [^/]\.php(/|$) {
        fastcgi_pass php_spa_example_com;
        include      nginxconfig.io/php_fastcgi.conf;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# non-www, subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             .spa.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;
    # return                  301 https://www.spa.example.com$request_uri;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}


server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             www.frontend.example.com;
    root                    /var/www/frontend.example.com/public;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/frontend.example.com/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # 2.5.3
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # additional config
    include nginxconfig.io/general.conf;

    
}

# CDN
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             cdn.frontend.example.com;
    root                    /var/www/frontend.example.com/public;

    # 2.5.3 comply
    # include                 nginxconfig.io/security.conf; # Add this

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/frontend.example.com/chain.pem;

    # disable access_log
    access_log              off;

    # gzip
    gzip                    on;
    gzip_vary               on;
    gzip_proxied            any;
    gzip_comp_level         6;
    gzip_types              text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # allow safe files
    location ~* \.(?:css(\.map)?|js(\.map)?|ttf|ttc|otf|eot|woff2?|svgz?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|pdf|docx?|dotx?|docm|dotm|xlsx?|xltx?|xlsm|xltm|pptx?|potx?|pptm|potm|ppsx?)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public";
        expires    30d;
    }

    # 253 rule comply
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # deny everything else
    location / {
        deny all;
    }
}

# non-www, subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             .frontend.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;
    return                  301 https://www.frontend.example.com$request_uri;

    # 2.5.3
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name cdn.frontend.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;


    # 2.5.3
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        return 301 https://cdn.frontend.example.com$request_uri;
    }
}

server {
    listen      80;
    listen      8082;
    listen      [::]:80;
    listen      [::]:8082;
    server_name .frontend.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # 2.5.3
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    location ~ /\. {
        deny all;
        return 404;
    }
    
    location / {
        return 301 https://www.frontend.example.com$request_uri;
    }
}

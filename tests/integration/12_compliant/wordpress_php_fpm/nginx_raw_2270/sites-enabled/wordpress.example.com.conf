server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             www.wordpress.example.com;
    set                     $base /var/www/wordpress.example.com;
    root                    $base/public;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;

    # security
    include                 nginxconfig.io/security.conf;

    # index.php
    index                   index.php;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # index.php fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # additional config
    include nginxconfig.io/general.conf;
    include nginxconfig.io/wordpress.example.com.wordpress.conf;

    # handle .php
    location ~ [^/]\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        include      nginxconfig.io/php_fastcgi.conf;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# non-www, subdomains redirect
server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             .wordpress.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_certificate         /etc/ssl/certs/nginx.crt;
    ssl_certificate_key     /etc/ssl/private/nginx.key;
    #ssl_trusted_certificate /etc/letsencrypt/live/django.example.com/chain.pem;
    # return                  301 https://www.wordpress.example.com$request_uri;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# HTTP redirect
server {
    listen      80;
    # listen      8084;
    listen      [::]:80;
    # listen      [::]:8084;
    server_name .wordpress.example.com;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        return 301 https://www.wordpress.example.com$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# Generated by nginxconfig.io
# See nginxconfig.txt for the configuration share link

user                 www-data;
pid                  /run/nginx.pid;
worker_processes     auto;
worker_rlimit_nofile 65535;

# Load modules
include              modules-enabled/*.conf;

events {
    multi_accept       on;
    worker_connections 65535;
}

http {
    charset                utf-8;
    sendfile               on;
    tcp_nopush             on;
    tcp_nodelay            on;
    log_not_found          off;
    types_hash_max_size    2048;
    types_hash_bucket_size 64;
    client_max_body_size   16M;
    server_tokens           off;

    # MIME
    include                mime.types;
    default_type           application/octet-stream;

    # Logging
    # access_log             off;
    error_log              /dev/null;

    # 2.5.2 comply
    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    # SSL
    ssl_session_timeout    1d;
    ssl_session_cache      shared:SSL:10m;
    ssl_session_tickets    off;

    # Diffie-Hellman parameter for DHE ciphersuites
    ssl_dhparam            /etc/nginx/dhparam.pem;

    # Mozilla Intermediate configuration
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # OCSP Stapling
    ssl_stapling           off;
    ssl_stapling_verify    off;
    resolver               8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 9.9.9.9 149.112.112.112 valid=60s;
    resolver_timeout       2s;

    # Load configs
    include                conf.d/*.conf;
    include                sites-enabled/*;

    # 2.4.2
    # this catch all server slove 2.4.2
    server {
        # Listen on standard ports for IPv4 and IPv6
        listen 80 default_server;
        listen [::]:80 default_server;
        # Listen for HTTPS (TCP) and QUIC (UDP)
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        listen 443 quic default_server;
        listen [::]:443 quic default_server;
        # Reject SSL Handshake for unknown domains (Prevents cert leakage)
        ssl_reject_handshake on;
        # Catch-all name
        server_name _;
        # Close connection without response (Non-standard code 444)
        return 444;
    }
}
# Magento: setup
location ^~ /setup {
    root $base;

    # allow index.php
    location ~ ^/setup/index.php {
        include nginxconfig.io/php_fastcgi.conf;

    }

    # deny everything except pub
    location ~ ^/setup/(?!pub/). {
        deny all;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# Magento: update
location ^~ /update {
    root $base;

    # allow index.php
    location ~ ^/update/index.php {
        include nginxconfig.io/php_fastcgi.conf;
    }

    # deny everything except pub
    location ~ ^/update/(?!pub/). {
        deny all;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# Magento: media files
location ^~ /media/ {
    try_files $uri $uri/ /get.php?$args;

    location ~* \.(?:ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
        expires    +1y;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
        try_files  $uri $uri/ /get.php?$args;
    }

    location ~* \.(?:zip|gz|gzip|bz2|csv|xml)$ {
        expires    off;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
        try_files  $uri $uri/ /get.php?$args;
    }

    location ~ ^/media/theme_customization/.*\.xml {
        deny all;
    }

    location ~ ^/media/(?:customer|downloadable|import)/ {
        deny all;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# Magento: static route
location @magento_static {
    rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# Magento: static files
location ^~ /static/ {
    expires   max;
    try_files $uri $uri/ @magento_static;

    location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
        expires    +1y;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
        try_files  $uri $uri/ magento_static;
    }

    location ~* .(zip|gz|gzip|bz2|csv|xml)$ {
        expires    off;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
        try_files  $uri $uri/ @magento_static;
    }

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}

# Magento: deny cron
location ~ cron\.php {
    allow 127.0.0.1;
    # allow 10.0.0.0/12;
    allow 10.0.0.1;
    deny all;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self';" always;
}
